<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Painel cidadão que acompanha governo, orçamento, legislativo e projetos de lei do Brasil, do Estado e da cidade de São Paulo, com fontes oficiais.">
<title>Observatório Cidadão SP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: ficha de protocolo — cabeçalho com abas por esfera de governo, seções empilhadas em grade de 12 colunas; números de processo em mono como no Diário Oficial */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --fg:#141a24; --muted:#5a6475; --faint:#8b94a3;
  --line:#dde2ea; --ink:#1f4fd1; --ink-soft:#dbe5fb; --ink-fill:#2d5be0; --ghost:#b9c8ef;
  --good:#1a7f4b; --good-bg:#e1f3e9; --warn:#a15c00; --warn-bg:#fbeed8;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f131a; --surface:#171c25; --fg:#e8ecf2; --muted:#a0aab9; --faint:#6f7a8b;
  --line:#2a3240; --ink:#8fb0ff; --ink-soft:#1e2a45; --ink-fill:#6f97f5; --ghost:#34466e;
  --good:#5fcf94; --good-bg:#15301f; --warn:#f0b35c; --warn-bg:#35270f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f131a; --surface:#171c25; --fg:#e8ecf2; --muted:#a0aab9; --faint:#6f7a8b;
  --line:#2a3240; --ink:#8fb0ff; --ink-soft:#1e2a45; --ink-fill:#6f97f5; --ghost:#34466e;
  --good:#5fcf94; --good-bg:#15301f; --warn:#f0b35c; --warn-bg:#35270f; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--ink)}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;padding-block:18px 10px}
.brand h1{margin:0;font:800 clamp(22px,3.4vw,30px)/1.05 var(--f-display);font-stretch:80%;letter-spacing:-.01em;text-transform:uppercase}
.brand h1 span{color:var(--ink)}
.stamp{font:500 11.5px var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:2px 7px;letter-spacing:.02em}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);font:600 14px var(--f-body);padding:10px 14px 12px;border-bottom:3px solid transparent}
nav.tabs a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--ink)}
nav.tabs a:hover{color:var(--fg)}

main{padding-block:28px 64px}
.lede{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:end;margin-bottom:28px}
.lede h2{margin:0 0 6px;font:800 clamp(30px,5vw,48px)/1 var(--f-display);font-stretch:78%;text-transform:uppercase;text-wrap:balance}
.lede p{margin:0;color:var(--muted);max-width:60ch}
.eyebrow{font:600 11.5px var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 8px}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;min-width:0}
.panel h3{margin:0 0 4px;font:700 19px/1.2 var(--f-display);font-stretch:90%}
.panel .sub{margin:0 0 16px;color:var(--muted);font-size:13.5px}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}
section.block{margin-top:36px}
section.block > .eyebrow{border-top:2px solid var(--fg);padding-top:10px;margin-bottom:14px}

/* executivo */
.exec{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;align-items:start}
.exec .role{grid-column:1/-1}
.seal{width:52px;height:52px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font:800 15px var(--f-display);color:var(--ink);font-stretch:80%}
.exec .name{font:700 22px/1.15 var(--f-display);font-stretch:88%;margin:0}
.exec .meta{color:var(--muted);font-size:13.5px;margin:2px 0 0}
.result{margin-top:14px;grid-column:1/-1}
.vbar{display:flex;height:12px;border-radius:3px;overflow:hidden;gap:2px;background:var(--surface)}
.vbar i{display:block;height:100%}
.vlegend{display:flex;justify-content:space-between;gap:12px;font-size:13px;margin-top:6px;flex-wrap:wrap}
.vlegend b{font-variant-numeric:tabular-nums}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:6px;padding:14px 16px;background:var(--surface);min-width:0}
.kpi .k{font-size:12.5px;color:var(--muted);margin:0}
.kpi .v{font:700 30px/1.1 var(--f-display);font-stretch:85%;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:15px;font-weight:600;color:var(--muted)}
.kpi .n{font-size:12.5px;color:var(--muted);margin:0}
.pill{display:inline-flex;align-items:center;gap:4px;font:600 11.5px var(--f-body);padding:2px 8px;border-radius:99px;margin-top:8px}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.info{background:var(--ink-soft);color:var(--ink)}

/* barras horizontais */
.hbars{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:13.5px}
.hbars .lbl{color:var(--fg);white-space:nowrap}
.hbars .track{position:relative;height:14px}
.hbars .fill{position:absolute;left:0;top:0;height:100%;background:var(--ink-fill);border-radius:0 4px 4px 0;min-width:2px}
.hbars .ghost{position:absolute;left:0;top:0;height:100%;background:var(--ghost);border-radius:0 4px 4px 0}
.hbars.paired .track{height:18px}
.hbars.paired .fill{top:5px;height:13px}
.hbars.paired .ghost{top:0;height:4px;border-radius:0 2px 2px 0}
.hbars .val{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.hbars .row{display:contents}
.hbars .row:hover .fill{background:var(--ink)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin:0 0 12px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px}

/* seats grid (hemiciclo em pontos) */
.seats{display:flex;flex-wrap:wrap;gap:3px;margin:4px 0 14px}
.seats i{width:10px;height:10px;border-radius:50%;background:var(--ghost)}
.seats i.on{background:var(--ink-fill)}

/* tramitação */
.bills{display:grid;gap:12px}
.bill{border:1px solid var(--line);border-radius:6px;padding:16px;background:var(--surface);display:grid;gap:8px;min-width:0}
.bill .head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}
.bill .proto{font:500 13px var(--f-mono);color:var(--ink);letter-spacing:.01em}
.bill .date{font:12.5px var(--f-mono);color:var(--muted)}
.bill h4{margin:0;font:700 17px/1.25 var(--f-display);font-stretch:92%;text-wrap:balance}
.bill p{margin:0;color:var(--muted);font-size:14px;max-width:75ch}
.bill .vote{font-size:13px;color:var(--fg)}
.track-steps{list-style:none;margin:4px 0 0;padding:0;display:flex;gap:2px;overflow-x:auto}
.track-steps li{flex:1 1 0;min-width:84px;font-size:11.5px;color:var(--faint);padding-top:8px;border-top:4px solid var(--line);line-height:1.3}
.track-steps li.done{border-top-color:var(--ink-fill);color:var(--muted)}
.track-steps li.now{border-top-color:var(--ink);color:var(--fg);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.filters input{flex:1 1 220px;min-width:0;font:14px var(--f-body);padding:9px 12px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--fg)}
.chip{font:600 12.5px var(--f-body);padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.empty{color:var(--muted);font-size:14px;padding:12px 0}

table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.tscroll{overflow-x:auto}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.t th{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
table.t td.r,table.t th.r{text-align:right;font-variant-numeric:tabular-nums}

.facts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.facts li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:8px;font-size:14px}
.facts li span:last-child{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}

.src{font-size:12px;color:var(--faint);margin:12px 0 0}
.src a{color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--good)}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
.votes{list-style:none;margin:0;padding:0;display:grid;gap:10px;max-height:520px;overflow-y:auto}
.votes li{border-bottom:1px solid var(--line);padding-bottom:10px;font-size:13.5px;display:grid;gap:4px}
.votes .vh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note{background:var(--ink-soft);border-radius:6px;padding:14px 16px;font-size:14px;color:var(--fg)}
.method ol{padding-left:20px;margin:8px 0 0;display:grid;gap:6px;max-width:75ch}
.srclist{columns:2 300px;gap:24px;font-size:13.5px;padding-left:18px}
.srclist li{break-inside:avoid;margin-bottom:6px}

#tip{position:fixed;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12.5px;padding:6px 9px;border-radius:4px;z-index:20;max-width:240px}
footer{border-top:1px solid var(--line);padding-block:20px;color:var(--muted);font-size:12.5px}

@media (max-width:860px){
  .lede{grid-template-columns:1fr}
  .span-8,.span-7,.span-6,.span-5,.span-4{grid-column:span 12}
}
@media (prefers-reduced-motion:no-preference){
  .fill{transition:width .5s ease}
}
</style>
</head>

const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (n,d=1) => n.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const link = ([t,u]) => `<a href="${u}" target="_blank" rel="noopener">${esc(t)}</a>`;

function execPanel(e){
  let r="";
  if(e.eleicao){
    const x=e.eleicao, rest=Math.max(0,100-x.a[1]-x.b[1]);
    r=`<div class="result"><p class="eyebrow" style="margin-bottom:6px">${esc(x.titulo)}</p>
      <div class="vbar" role="img" aria-label="${esc(x.a[0])} ${fmt(x.a[1],2)}%, ${esc(x.b[0])} ${fmt(x.b[1],2)}%">
        <i style="width:${x.a[1]}%;background:var(--ink-fill)" data-tip="${esc(x.a[0])}: ${fmt(x.a[1],2)}%${x.a[2]?" · "+x.a[2]+" votos":""}"></i>
        <i style="width:${x.b[1]}%;background:var(--ghost)" data-tip="${esc(x.b[0])}: ${fmt(x.b[1],2)}%${x.b[2]?" · "+x.b[2]+" votos":""}"></i>
        ${rest>0.2?`<i style="width:${rest}%;background:var(--line)" data-tip="Outros: ${fmt(rest,2)}%"></i>`:""}
      </div>
      <div class="vlegend"><span>${esc(x.a[0])} <b>${fmt(x.a[1],2)}%</b></span><span>${esc(x.b[0])} <b>${fmt(x.b[1],2)}%</b></span></div>
      <p class="src" style="margin-top:4px">${esc(x.extra)}</p></div>`;
  }
  return `<div class="panel span-5"><div class="exec">
    <p class="eyebrow role">Poder Executivo · ${esc(e.cargo)}</p>
    <div class="seal" aria-hidden="true">${esc(e.sigla)}</div>
    <div><p class="name">${esc(e.nome)}</p><p class="meta">${esc(e.partido)} · ${esc(e.mandato)}</p></div>
    ${r}</div><p class="src">Fonte: ${link(e.fonte)}</p></div>`;
}

function kpiBlock(list){
  return `<div class="kpis">${list.map(k=>`<div class="kpi">
    <p class="k">${esc(k.k)}</p><p class="v">${esc(k.v)} <small>${esc(k.u)}</small></p>
    <p class="n">${esc(k.n)}</p>${k.pill?`<span class="pill ${k.pill[0]}">${esc(k.pill[1])}</span>`:""}
    <p class="src" style="margin-top:8px">${k.live?'<span class="live">ao vivo</span> ':""}<a href="${k.src}" target="_blank" rel="noopener">ver fonte</a></p></div>`).join("")}</div>`;
}

function casaPanel(c,span="span-7"){
  const max=Math.max(...c.partidos.map(p=>p[1]));
  let seats="";
  c.partidos.forEach(([p,n],i)=>{for(let j=0;j<n;j++) seats+=`<i class="${i===0?"on":""}" data-tip="${esc(p)}: ${n} ${n>1?"cadeiras":"cadeira"}"></i>`;});
  return `<div class="panel ${span}"><h3>${esc(c.titulo)}</h3><p class="sub">${esc(c.sub)}</p>
    <div class="hbars">${c.partidos.map(([p,n])=>`<div class="row" data-tip="${esc(p)}: ${n} de ${c.total} (${fmt(n/c.total*100)}%)">
      <span class="lbl">${esc(p)}</span><span class="track"><span class="fill" style="width:${n/max*100}%"></span></span><span class="val">${n}</span></div>`).join("")}</div>
    ${c.destaque?`<p class="sub" style="margin:14px 0 0">${esc(c.destaque)}</p>`:""}
    <p class="src">Cores neutras de propósito: o painel não associa partidos a cores. Fonte: ${link(c.fonte)}</p></div>`;
}

function steps(et,agora,fim){
  return `<ol class="track-steps" aria-label="Tramitação">${et.map((s,i)=>`<li class="${i<agora||(fim&&i===agora)?"done":""} ${i===agora?"now":""}"${i===agora?' aria-current="step"':""}>${esc(s)}</li>`).join("")}</ol>`;
}

function billCard(b){
  return `<article class="bill" data-text="${esc((b.proto+" "+b.titulo+" "+b.texto+" "+b.tema).toLowerCase())}" data-tema="${esc(b.tema)}">
    <div class="head"><span class="proto">${esc(b.proto)} · ${esc(b.tema)}</span><span class="date">atualizado ${esc(b.data)}</span></div>
    <h4>${esc(b.titulo)}</h4><p>${esc(b.texto)}</p><p class="vote">${esc(b.voto)}</p>
    ${steps(b.etapas,b.agora,b.fim)}
    <p class="src" style="margin:0"><a href="${b.fonte}" target="_blank" rel="noopener">ver fonte</a></p></article>`;
}

function projetosBlock(list,key){
  const temas=[...new Set(list.map(b=>b.tema))];
  return `<div class="filters"><input id="q-${key}" aria-label="Buscar projetos" type="search" placeholder="Buscar por número, tema ou palavra" data-q>
    <button class="chip" aria-pressed="true" data-tema="">Todos</button>
    ${temas.map(t=>`<button class="chip" aria-pressed="false" data-tema="${esc(t)}">${esc(t)}</button>`).join("")}</div>
    <div class="bills">${list.map(billCard).join("")}</div><p class="empty" hidden>Nenhum projeto encontrado com esse filtro.</p>`;
}

function render(view){

  document.querySelectorAll("nav.tabs a").forEach(a=>{ if(a.dataset.view===view) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });

  // Orçamento
  h+=`<section class="block"><p class="eyebrow">Orçamento</p><div class="grid">`;

      <p class="src">Fontes: ${o.fontes.map(link).join(" · ")}</p></div>`;
  }
  if(d.orcBars){
    const o=d.orcBars,max=Math.max(...o.linhas.map(l=>l[1]));

      <div class="hbars">${o.linhas.map(([a,v])=>`<div class="row" data-tip="${esc(a)}: R$ ${fmt(v)} bi"><span class="lbl">${esc(a)}</span><span class="track"><span class="fill" style="width:${v/max*100}%"></span></span><span class="val">${fmt(v)}</span></div>`).join("")}</div>

      <div class="legend"><span><i style="background:var(--ink-fill)"></i>2027 (proposta)</span><span><i style="background:var(--ghost);height:4px"></i>2026 (aprovado)</span></div>
      <div class="hbars paired">${o.linhas.map(([a,v26,v27])=>{const pct=(v27/v26-1)*100;return `<div class="row" data-tip="${esc(a)}: R$ ${fmt(v26,2)} bi em 2026 → R$ ${fmt(v27,2)} bi em 2027 (${pct>=0?"+":""}${fmt(pct)}%)">
        <span class="lbl">${esc(a)}</span><span class="track"><span class="ghost" style="width:${v26/max*100}%"></span><span class="fill" style="width:${v27/max*100}%"></span></span><span class="val">${fmt(v27,2)} <span style="color:var(--faint)">${pct>=0?"+":""}${fmt(pct)}%</span></span></div>`}).join("")}</div>

        :`<li><span>Vereadores por partido</span><span><a href="https://www.saopaulo.sp.leg.br/vereadores/membros/?filtro=partido" target="_blank" rel="noopener">Câmara SP</a></span></li><li><span>Próxima eleição municipal</span><span>out/2028</span></li><li><span>Sessões do plenário</span><span><a href="https://www.saopaulo.sp.leg.br/" target="_blank" rel="noopener">Câmara SP</a></span></li>`}</ul></div>`;

  h+=`<section class="block"><p class="eyebrow">Projetos em tramitação e aprovados recentemente</p>${projetosBlock(d.projetos,view)}</section>`;
  app.innerHTML=h;
  wireFilters(app);
}

function wireFilters(root){
  const q=root.querySelector("[data-q]"); if(!q) return;
  let tema="";
  const apply=()=>{const t=q.value.trim().toLowerCase();let shown=0;
    root.querySelectorAll(".bill").forEach(b=>{const ok=(!t||b.dataset.text.includes(t))&&(!tema||b.dataset.tema===tema);b.hidden=!ok;if(ok)shown++;});
    root.querySelector(".empty").hidden=shown>0;};
  q.addEventListener("input",apply);
  root.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{tema=c.dataset.tema;root.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===c?"true":"false"));apply();}));
}

// tooltip
const tip=document.getElementById("tip");
document.addEventListener("pointermove",e=>{const t=e.target.closest&&e.target.closest("[data-tip]");
  if(!t){tip.hidden=true;return;} tip.textContent=t.dataset.tip;tip.hidden=false;
  const w=tip.offsetWidth; let x=e.clientX+14; if(x+w>innerWidth-8)x=e.clientX-w-14; tip.style.left=Math.max(8,x)+"px"; tip.style.top=(e.clientY+16)+"px";});
document.addEventListener("pointerleave",()=>tip.hidden=true);

function route(){const v=(location.hash||"#brasil").slice(1);render(["brasil","estado","cidade","fontes"].includes(v)?v:"brasil");}
addEventListener("hashchange",()=>{route();window.scrollTo(0,0);});
// ---------- Camada ao vivo: consulta as funções /api/* do próprio site ----------
const LIVE={camara:null,camaraErro:null,quando:null};
const MESES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const mesAno=iso=>{const [y,m]=iso.split("-");return `${MESES[+m-1]}/${y}`;};
const dataBR=iso=>{const [y,m,d]=iso.slice(0,10).split("-");return `${d}/${m}/${y}`;};
const norm=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
async function api(path){
  const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),12000);
  try{const r=await fetch(path,{signal:ctrl.signal,headers:{Accept:"application/json"}});
    if(!r.ok) throw new Error("HTTP "+r.status);
    if(!(r.headers.get("content-type")||"").includes("json")) throw new Error("resposta não é JSON");
    return await r.json();}
  finally{clearTimeout(t);}
}
function setKpi(view,id,patch){const k=D[view].kpis.find(x=>x.id===id); if(k) Object.assign(k,patch,{live:true});}

function aplicarIndicadores(j){
  let n=0;
  const last=a=>Array.isArray(a)&&a.length?a[a.length-1]:null;
  const ip=last(j.ipca12m), im=last(j.ipcaMes);
  if(ip){n++; setKpi("brasil","ipca",{v:fmt(ip.valor,2),n:`12 meses até ${mesAno(ip.data)}`+(im&&im.data===ip.data?` · ${fmt(im.valor,2)}% no mês`:""),
    pill:ip.valor>4.5?["warn","Acima do teto da meta (4,5%)"]:ip.valor<1.5?["warn","Abaixo do piso da meta (1,5%)"]:["good","Dentro do intervalo da meta"],
    src:"https://www3.bcb.gov.br/sgspub/localizarseries/localizarSeries.do?method=prepararTelaLocalizarSeries"});}
  const se=last(j.selic);
  if(se){n++; setKpi("brasil","selic",{v:fmt(se.valor,2),n:`Meta vigente em ${dataBR(se.data)}`,pill:["info","Definida pelo Copom"],src:"https://www.bcb.gov.br/controleinflacao/historicotaxasjuros"});}
  const de=j.desemprego, dl=last(de);
  if(dl){n++; const ant=de.length>=13?de[de.length-13]:null;
    setKpi("brasil","desemprego",{v:fmt(dl.valor,1),n:`Trimestre móvel até ${mesAno(dl.data)}`,
      pill:ant?(dl.valor<ant.valor?["good",`Abaixo de um ano antes (${fmt(ant.valor,1)}%)`]:dl.valor>ant.valor?["warn",`Acima de um ano antes (${fmt(ant.valor,1)}%)`]:["info","Igual a um ano antes"]):null,
      src:"https://www.ibge.gov.br/estatisticas/sociais/trabalho/9171-pesquisa-nacional-por-amostra-de-domicilios-continua-mensal.html"});}
  const po=j.populacao||{};
  if(po.brasil){n++; setKpi("brasil","popBrasil",{v:fmt(po.brasil.valor/1e6,1),n:`IBGE, estimativa ${po.brasil.ano}`,src:"https://sidra.ibge.gov.br/tabela/6579"});}
  if(po.cidade){n++; setKpi("cidade","popCidade",{v:fmt(po.cidade.valor/1e6,1),n:`IBGE, estimativa ${po.cidade.ano}`,src:"https://sidra.ibge.gov.br/tabela/6579"});}
  if(po.estado){D.estado.lede=D.estado.lede.replace(/cerca de [\d,]+ milhões/,`cerca de ${fmt(po.estado.valor/1e6,1)} milhões`);}
  return n;
}

function aplicarSenado(j){
  const lista=j.senadoresSP; if(!Array.isArray(lista)||!lista.length) return 0;
  const antigo=D.brasil.senado.linhas;
  D.brasil.senado.linhas=lista.map(s=>{
    const m=antigo.find(l=>norm(l[0]).includes(norm(s.nome))||norm(s.nome).includes(norm(l[0])));
    return [s.nome,s.partido||(m?m[1]:"—"),m?m[2]:"—",m?m[3]:"—"];
  });
  D.brasil.senado.sub="Em exercício (ao vivo). Cota parlamentar de 2026 até meados de outubro.";
  return 1;
}

function liveCamaraBlock(){
  if(!LIVE.camara) return `<div class="grid" style="margin-top:16px"><div class="panel span-12"><p class="sub" style="margin:0">A consulta ao vivo da Câmara não respondeu agora. Os dados acima são de 04/11/2026.</p></div></div>`;
  const c=LIVE.camara; let h=`<div class="grid" style="margin-top:16px">`;
  if(c.deputadosSP){
    h+=casaPanel({titulo:"Bancada paulista em exercício hoje",sub:`${c.deputadosSP.total} deputados federais por SP na legislatura atual`,total:c.deputadosSP.total,
      partidos:c.deputadosSP.partidos,destaque:"",fonte:["Câmara dos Deputados","https://www.camara.leg.br/deputados/quem-sao"]},"span-6").replace('<h3>','<p class="eyebrow" style="margin:0 0 6px"><span class="live">ao vivo</span></p><h3>');
  }
  if(Array.isArray(c.votacoes)){
    h+=`<div class="panel span-6"><p class="eyebrow" style="margin:0 0 6px"><span class="live">ao vivo</span></p><h3>Votações no plenário da Câmara</h3><p class="sub">Últimos 30 dias, mais recentes primeiro</p>
    ${c.votacoes.length?`<ul class="votes">${c.votacoes.map(v=>`<li><div class="vh"><span class="date mono" style="color:var(--muted);font-size:12px">${esc(dataBR(v.data))}</span>
      ${v.aprovada===true?'<span class="pill good" style="margin:0">Aprovado</span>':v.aprovada===false?'<span class="pill warn" style="margin:0">Rejeitado</span>':""}</div>
      <span>${esc(v.descricao)}</span><a class="src" style="margin:0" href="${v.registro}" target="_blank" rel="noopener">registro oficial</a></li>`).join("")}</ul>`
      :`<p class="empty">Nenhuma votação em plenário nos últimos 30 dias.</p>`}
    <p class="src">Fonte: <a href="https://dadosabertos.camara.leg.br/" target="_blank" rel="noopener">Câmara dos Deputados · Dados Abertos</a></p></div>`;
  }
  return h+`</div>`;
}

async function carregarAoVivo(){
  const [ind,cam,sen]=await Promise.allSettled([api("/api/indicadores"),api("/api/camara"),api("/api/senado")]);
  let ok=0, quando=null;
  const marca=j=>{if(j&&j.consultadoEm&&(!quando||j.consultadoEm<quando)) quando=j.consultadoEm;};
  if(ind.status==="fulfilled"){ok+=aplicarIndicadores(ind.value); marca(ind.value);}
  if(cam.status==="fulfilled"&&(cam.value.deputadosSP||cam.value.votacoes)){LIVE.camara=cam.value; ok++; marca(cam.value);} else LIVE.camaraErro=true;
  if(sen.status==="fulfilled"){ok+=aplicarSenado(sen.value); marca(sen.value);}
  const st=document.getElementById("stamp");
  if(ok&&quando){const d=new Date(quando); st.textContent=`AO VIVO · CONSULTADO ${d.toLocaleDateString("pt-BR")} ${d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}`;}
  if(ok){const y=scrollY; route(); scrollTo(0,y);}
}

route();
carregarAoVivo();
